services:
  - type: web
    name: mediadrop-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
      - key: TEMP_DIR
        value: /tmp/mediadrop
      - key: MAX_FILE_SIZE
        value: 500
      - key: MAX_DURATION
        value: 600
      - key: DOWNLOAD_URL_TTL
        value: 900
